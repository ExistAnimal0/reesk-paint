<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Paint</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1e1e24; color:#eee; margin:0; }
  .bar { display:flex; gap:14px; align-items:center; padding:10px 16px; background:#2a2a33; }
  .bar label { font-size:13px; }
  canvas { display:block; background:#fff; border:2px solid #444; border-radius:6px; cursor:crosshair; }
  button { padding:6px 12px; border:0; border-radius:6px; background:#4b6bff; color:#fff; cursor:pointer; }
  button:hover { background:#3a59e6; }
  input[type=color] { width:34px; height:26px; border:0; background:none; }
  #status { margin-left:auto; font-size:12px; color:#888; }
</style>
</head>
<body>
<div class="bar">
  <label>Color <input type="color" id="color" value="#e11d48"></label>
  <label>Size <input type="range" id="size" min="1" max="60" value="6"> <span id="sizeval">6</span></label>
  <button id="clear">Clear</button>
  <button id="save">Save PNG</button>
  <button id="load">Load PNG</button>
  <span id="status">connecting…</span>
</div>
<canvas id="cv" width="900" height="600"></canvas>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const colorEl = document.getElementById('color');
const sizeEl = document.getElementById('size');
const sizeval = document.getElementById('sizeval');
const status = document.getElementById('status');
sizeEl.oninput = () => sizeval.textContent = sizeEl.value;

let lastVersion = -1;
let drawing = false;
let cur = [];

function pos(e){
  const r = cv.getBoundingClientRect();
  return [ (e.clientX - r.left) * (cv.width / r.width),
           (e.clientY - r.top)  * (cv.height / r.height) ];
}

cv.addEventListener('pointerdown', e => {
  drawing = true; cur = [pos(e)];
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  cur.push(pos(e));
  // live preview
  if (cur.length >= 2){
    ctx.strokeStyle = colorEl.value;
    ctx.lineWidth = sizeEl.value;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cur[cur.length-2][0], cur[cur.length-2][1]);
    ctx.lineTo(cur[cur.length-1][0], cur[cur.length-1][1]);
    ctx.stroke();
  }
});
cv.addEventListener('pointerup', async e => {
  if (!drawing) return;
  drawing = false;
  cur.push(pos(e));
  await fetch('/api/stroke', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ points: cur, color: colorEl.value, size: +sizeEl.value })
  });
  cur = [];
});

function render(strokes, image){
  ctx.clearRect(0,0,cv.width,cv.height);
  if (image){
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img,0,0,cv.width,cv.height);
      drawStrokes(strokes);
    };
    img.src = image;
  } else {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0,0,cv.width,cv.height);
    drawStrokes(strokes);
  }
}
function drawStrokes(strokes){
  for (const s of strokes){
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.size;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    const pts = s.points;
    if (pts.length >= 2){
      ctx.moveTo(pts[0][0],pts[0][1]);
      for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.stroke();
    } else if (pts.length===1){
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(pts[0][0],pts[0][1],s.size/2,0,7);
      ctx.fill();
    }
  }
}

async function poll(){
  try {
    const r = await fetch('/api/state');
    const st = await r.json();
    if (st.version !== lastVersion){
      lastVersion = st.version;
      if (!drawing) render(st.strokes, st.image);
    }
    status.textContent = 'connected · v' + st.version;
  } catch { status.textContent = 'reconnecting…'; }
}
setInterval(poll, 500);
poll();

document.getElementById('clear').onclick = async () => {
  await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
};
document.getElementById('save').onclick = async () => {
  const r = await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path:'paint_app/out.png'})});
  const j = await r.json();
  status.textContent = j.ok ? ('saved → ' + j.path) : ('error: ' + j.error);
};
document.getElementById('load').onclick = async () => {
  const p = prompt('PNG file path to load:');
  if (!p) return;
  const r = await fetch('/api/load',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path:p})});
  const j = await r.json();
  status.textContent = j.ok ? ('loaded ' + p) : ('error: ' + j.error);
};
</script>
</body>
</html>
